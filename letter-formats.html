<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letter Formats · CASH TOOL</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e6de;color:#17354a;font:15px/1.5 system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,[contenteditable]:focus-visible{outline:3px solid #6595bb;outline-offset:4px}[hidden]{display:none!important}.header{padding:19px 28px;background:linear-gradient(135deg,#8ba5b5,#607f96);box-shadow:0 3px 0 #48687e,0 8px 18px #20384b24;display:flex;align-items:center;justify-content:space-between;color:#13354a}.brand{font-size:19px;font-weight:800;letter-spacing:.05em}.demo{font-size:11px;font-weight:750;letter-spacing:.1em;background:#f8f6efbf;padding:5px 10px;border-radius:6px}.gallery{max-width:1060px;margin:50px auto;padding:0 24px}.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.17em;color:#718795}.gallery h1{font-size:34px;letter-spacing:-1px;margin:5px 0 8px}.lead{color:#6a7780;margin:0 0 30px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.tile{color:inherit;background:linear-gradient(145deg,#fffdf7,#e9e5db);border:1px solid #c9c4b8;border-radius:18px;box-shadow:0 4px 0 #c8c3b6,0 9px 18px #243c4a12,inset 0 1px #fff;padding:25px;text-align:left;min-height:205px;transition:transform .18s,box-shadow .18s}.tile:hover{transform:translateY(-4px);box-shadow:0 5px 0 #c8c3b6,0 13px 24px #243c4a20}.tile:active{transform:translateY(1px)}.icon{display:grid;place-items:center;width:45px;height:49px;border-radius:11px;background:linear-gradient(140deg,#527a96,#193c55);color:white;box-shadow:0 2px 0 #102c3b,inset 0 1px #91a9b9;margin-bottom:20px}.icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.tile strong{display:block;font-size:16px}.tile p{font-size:13px;color:#6a7780;margin:7px 0 17px}.open{font-size:12px;font-weight:750;color:#335e7c}.workspace{padding:25px 22px 60px}.toolbar{max-width:794px;margin:0 auto 18px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.toolbar .title{flex:1;margin:0 5px;font-weight:750}.control{border:1px solid #c7c4bb;border-radius:9px;background:linear-gradient(#fffdf7,#e9e5db);color:#203e53;box-shadow:0 2px 0 #c7c2b5;padding:9px 13px;font-size:13px;font-weight:700}.primary{background:linear-gradient(#476c87,#24465f);border-color:#24465f;color:white;box-shadow:0 2px 0 #19384d}.hint{max-width:794px;margin:0 auto 12px;color:#6b7780;font-size:12px;display:flex;justify-content:space-between;gap:14px}.paper-wrap{overflow-x:auto;padding:2px 6px 24px}.sheet{width:210mm;min-height:297mm;margin:0 auto;background:#fff;color:#171717;padding:24mm 23mm;box-shadow:0 2px 5px #0002,0 18px 45px #253a4d1c;border:1px solid #d7d7d7;font:11.5pt/1.4 Arial,sans-serif;white-space:pre-wrap;overflow-wrap:break-word}.sheet:focus{outline:2px solid #658ba9;outline-offset:3px}.status{color:#365f4b}footer{text-align:center;padding:12px 20px 25px;color:#7b858a;font-size:11px}@media(max-width:760px){.header{padding:17px 20px}.gallery{margin:30px auto}.gallery h1{font-size:29px}.tiles{grid-template-columns:1fr 1fr;gap:12px}.tile{padding:20px;min-height:190px}.workspace{padding:20px 8px 40px}.toolbar,.hint{padding:0 8px}.toolbar .title{order:3;flex-basis:100%;margin:10px 0 0}.sheet{width:100%;min-height:1050px;padding:30px 25px;font-size:14px;line-height:1.7}.paper-wrap{overflow:visible}.hint{font-size:11px}}@media(max-width:420px){.tiles{grid-template-columns:1fr}.tile{min-height:0;position:relative;padding-left:83px}.icon{position:absolute;left:20px;top:24px}.tile p{margin-bottom:11px}}@page{size:A4 portrait;margin:0}@media print{body{background:white}.header,.toolbar,.hint,footer,.gallery{display:none!important}.workspace,.paper-wrap{display:block;padding:0;margin:0;overflow:visible}.sheet{width:210mm;min-height:297mm;padding:24mm 23mm;margin:0;box-shadow:none;border:0;font-size:11.5pt;line-height:1.4;outline:0;print-color-adjust:exact}}
</style><style>
body{background:transparent}.gallery{margin:12px auto 26px;padding:0 12px}.workspace{padding:12px 0 30px}
body[data-theme="dark"]{color:#e7edf5}body[data-theme="dark"] .tile{color:#edf2f7;background:linear-gradient(145deg,#293f51,#182d3f);border-color:#41566a;box-shadow:0 4px 0 #0b1a28,0 9px 18px #0002,inset 0 1px #62798b}body[data-theme="dark"] .tile p,body[data-theme="dark"] .lead,body[data-theme="dark"] .hint,body[data-theme="dark"] .eyebrow{color:#b4c1cc}body[data-theme="dark"] .open{color:#a9d3f0}body[data-theme="dark"] .control{color:#e7edf5;background:linear-gradient(#38546a,#253e53);border-color:#4c6171;box-shadow:0 2px 0 #0e2130}body[data-theme="dark"] .status{color:#add7bc}.sheet{color:#171717;background:white}
@media print{body{background:white!important}.workspace,.paper-wrap{padding:0;margin:0}.sheet{color:#171717!important}}
</style></head><body><main><section class="gallery" id="gallery"><div class="eyebrow">Letter formats</div><h1>The right words, ready.</h1><p class="lead">Choose a format. Edit the details on a clean A4 sheet.</p><div class="tiles" id="tiles"></div></section><section id="workspace" class="workspace" hidden><div class="toolbar"><button class="control" id="back">← Formats</button><span class="title" id="letter-title"></span><button class="control" id="reset">Reset</button><button class="control" id="copy">Copy</button><button class="control primary" id="print">Print</button></div><div class="hint"><span>Replace the [bracketed details]. Click the sheet to edit.</span><span id="status" class="status" role="status"></span></div><div class="paper-wrap"><article class="sheet" id="sheet" contenteditable="true" role="textbox" aria-label="Editable letter" aria-multiline="true" spellcheck="true"></article></div></section></main><script>
const formats={"leave": {"name": "Leave Request", "icon": "calendar", "desc": "Request leave in advance.", "subject": "Request for leave", "body": "Respected Sir/Madam,\n\nI request leave from [Start Date] to [End Date] for [Reason for Leave]. I plan to resume my duties on [Return Date].\n\nI will complete my pending work and arrange the necessary handover before my leave. Please approve my request.\n\nThank you for your consideration."}, "unplanned": {"name": "Apology for Unplanned Leave", "icon": "clock", "desc": "Apologise for leave without prior notice.", "subject": "Apology for taking unplanned leave", "body": "Respected Sir/Madam,\n\nI sincerely apologise for being absent from work on [Date / Dates] without prior notice or approval. Due to [Reason for Absence], I was unable to inform you in advance.\n\nI understand that my unexpected absence may have affected work and caused inconvenience to the team. I regret the lack of timely communication and take responsibility for it.\n\nI will complete my pending work and ensure that I inform my reporting manager promptly if an emergency arises in the future. I request you to accept my apology and consider regularising my absence for the above period.\n\nThank you for your understanding."}, "target": {"name": "Target Not Achieved", "icon": "chart", "desc": "Apologise and explain your improvement plan.", "subject": "Apology for not achieving the assigned target", "body": "Respected Sir/Madam,\n\nI sincerely apologise for not achieving the target assigned to me for [Period]. My assigned target was [Target], and my achievement was [Actual Achievement].\n\nThe shortfall occurred due to [Brief Explanation]. I understand the importance of meeting my responsibilities and take accountability for my performance.\n\nTo improve, I will [Specific Action Plan] and review my progress with [Reporting Manager] by [Review Date]. I request your guidance and an opportunity to improve my performance.\n\nThank you for your consideration."}, "misconduct": {"name": "Apology for Misconduct", "icon": "heart", "desc": "Acknowledge an incident and apologise.", "subject": "Apology for my conduct", "body": "Respected Sir/Madam,\n\nI sincerely apologise for my conduct during [Incident / Occasion] on [Date]. I recognise that [Brief Description of Conduct] was inappropriate and caused [Impact].\n\nI take responsibility for my actions and regret the inconvenience caused. Going forward, I will [Corrective Steps] and follow the expected standards of professional conduct.\n\nI request you to accept my apology and give me an opportunity to demonstrate improvement.\n\nThank you for your understanding."}, "resignation": {"name": "Resignation Letter", "icon": "document", "desc": "Submit a formal resignation.", "subject": "Resignation from the position of [Designation]", "body": "Respected Sir/Madam,\n\nPlease accept this letter as formal notice of my resignation from the position of [Designation] at [Company Name], submitted on [Date]. In accordance with my applicable notice period, my proposed last working day is [Last Working Date].\n\nI am resigning due to [Reason for Resignation].\n\nI appreciate the opportunities and support I have received during my employment. I will complete the necessary handover and assist with a smooth transition during my notice period.\n\nPlease acknowledge my resignation and advise me on the required exit formalities.\n\nThank you for your support."}, "productivity": {"name": "Apology for Zero Productivity", "icon": "chart", "desc": "Explain a period without productive output.", "subject": "Apology for zero productivity during [Period]", "body": "Respected Sir/Madam,\n\nI sincerely apologise for not delivering any productive output during [Date / Period] in my role as [Designation]. I understand that this affected my responsibilities and the team's performance.\n\nThe reason for my lack of productivity was [Reason / Brief Explanation]. I recognise the need to communicate difficulties promptly and take responsibility for improving my performance.\n\nTo address this, I will [Specific Corrective Actions], work towards [Agreed Daily / Weekly Goal], and review my progress with [Reporting Manager] on [Review Date].\n\nI request you to accept my apology and give me an opportunity to demonstrate improvement. I will seek guidance promptly whenever I need support.\n\nThank you for your consideration."}};
const paths={calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18m-13 5h3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chart:'<path d="M4 4v16h17M8 16v-4m5 4V8m5 8V5"/>',heart:'<path d="M20.5 5.5a5 5 0 0 0-7 0L12 7l-1.5-1.5a5 5 0 0 0-7 7L12 21l8.5-8.5a5 5 0 0 0 0-7Z"/>',document:'<path d="M14 3H5v18h14V8Z M14 3v5h5M8 12h8m-8 4h6"/>'};
const gallery=document.getElementById('gallery'),workspace=document.getElementById('workspace'),sheet=document.getElementById('sheet'),status=document.getElementById('status');let selected=null;
function template(f){return `From\n[Your Name]\n[Employee ID]\n[Designation]\n[Branch / Department]\n\nDate: [DD/MM/YYYY]\n\nTo\n[Recipient Name / Reporting Manager]\n[Designation]\n[Company Name]\n[Branch / Office]\n\nSubject: ${f.subject}\n\n${f.body}\n\nYours sincerely,\n\n[Signature]\n[Your Name]\n[Employee ID]`;}
for(const [key,f]of Object.entries(formats)){const b=document.createElement('button');b.className='tile';b.innerHTML=`<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">${paths[f.icon]}</svg></span><strong>${f.name}</strong><p>${f.desc}</p><span class="open">View format →</span>`;b.addEventListener('click',()=>{selected=key;sheet.textContent=template(f);document.getElementById('letter-title').textContent=f.name;gallery.hidden=true;workspace.hidden=false;status.textContent='';window.scrollTo(0,0);});document.getElementById('tiles').append(b);}
document.getElementById('back').onclick=()=>{workspace.hidden=true;gallery.hidden=false;window.scrollTo(0,0)};document.getElementById('reset').onclick=()=>{if(confirm('Reset this letter to its original format?')){sheet.textContent=template(formats[selected]);status.textContent='Format restored.';}};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(sheet.innerText);status.textContent='Letter copied.';}catch{status.textContent='Select the letter text to copy it.';}};document.getElementById('print').onclick=()=>window.print();sheet.addEventListener('input',()=>status.textContent='');

function reportHeight(){if(parent!==window)parent.postMessage({type:'cash-tool-frame-height',height:Math.ceil(document.documentElement.getBoundingClientRect().height)},location.origin)}
new ResizeObserver(reportHeight).observe(document.body);window.addEventListener('load',reportHeight);
window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='cash-tool-theme')return;document.body.dataset.theme=event.data.theme==='dark'?'dark':'light';});
</script></body></html>
