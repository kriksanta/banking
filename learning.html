function cleanLessonTitle(title){return title
 .replace(/\s*\(\s*(?:part\s*)?\d+\s*(?:of|\/)\s*\d+\s*\)/gi,'')
 .replace(/\s+(?:part\s*)?\d+\s+of\s+\d+\s*$/gi,'')
 .replace(/\s+p\d+\s*$/gi,'')
 .replace(/^Section\s+\d+\s*:\s*/i,'')
 .replace(/^\d+\.\d+\s+/,'')
 .replace(/^\d+\s+(?=Excel\b)/i,'')
 .replace(/^(Sales Training (?:Tip|Video|Moment)|Sales Influence (?:Video|Moment))\s*#\d+\s*[-:]\s*/i,'')
 .replace(/\s{2,}/g,' ').trim();}
for(const videos of Object.values(courseVideos))for(const video of videos)video.title=cleanLessonTitle(video.title);

function showLessonList(name){content.replaceChildren();if(!courseVideos[name]?.length){content.innerHTML=empty;return;}if(name==='Excel'){const credit=document.createElement('p');credit.className='video-note';credit.textContent='Microsoft Excel Full Course 2025 Edition · Pavan Lalwani · 25 videos';content.append(credit);}if(name==='Sales'){const credit=document.createElement('p');credit.className='video-note';credit.textContent='26 lessons · Jeremy Miner and Victor Antonio';content.append(credit);}courseVideos[name].forEach((video,index)=>{const lesson=document.createElement('button');lesson.type='button';lesson.className='lesson';lesson.style.marginBottom='16px';lesson.innerHTML='<span class="play-symbol" aria-hidden="true">▶</span><span><small></small><strong></strong><span class="watch">Watch lesson →</span></span>';lesson.querySelector('small').textContent='LESSON '+String(index+1).padStart(2,'0')+' · VIDEO';lesson.querySelector('strong').textContent=video.title;lesson.addEventListener('click',()=>showVideo(name,video,index));content.append(lesson);});}
function showVideo(name,video,index){content.replaceChildren();const panel=document.createElement('div');panel.className='video-panel';panel.innerHTML='<button class="control video-back" type="button">← Lessons</button><div class="eyebrow"></div><h2></h2><div class="video-wrap"><iframe title="Learning video" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><p class="video-note">Tap Play to start. <a target="_blank" rel="noopener noreferrer">Open on YouTube</a> if playback is unavailable.</p>';panel.querySelector('.eyebrow').textContent=name+' · Lesson '+String(index+1).padStart(2,'0');panel.querySelector('h2').textContent=video.title;panel.querySelector('iframe').src='https://www.youtube-nocookie.com/embed/'+video.id+'?rel=0';panel.querySelector('a').href='https://www.youtube.com/watch?v='+video.id;panel.querySelector('button').addEventListener('click',()=>showLessonList(name));content.append(panel);window.scrollTo(0,0);if(parent!==window)parent.postMessage({type:"cash-tool-frame-scroll-top"},location.origin);}
document.querySelectorAll('[data-topic]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('#topic-heading').textContent=button.dataset.topic;showLessonList(button.dataset.topic);home.hidden=true;topic.hidden=false;window.scrollTo(0,0);if(parent!==window)parent.postMessage({type:"cash-tool-frame-scroll-top"},location.origin)}));document.querySelector('#back-topics').addEventListener('click',()=>{content.innerHTML=empty;home.hidden=false;topic.hidden=true;window.scrollTo(0,0);if(parent!==window)parent.postMessage({type:"cash-tool-frame-scroll-top"},location.origin)});

function reportLearningHeight(){if(parent!==window){const main=document.querySelector('main');parent.postMessage({type:'cash-tool-frame-height',height:Math.ceil(main.getBoundingClientRect().bottom+24)},location.origin);}}
new ResizeObserver(reportLearningHeight).observe(document.body);window.addEventListener('load',reportLearningHeight);
window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='cash-tool-theme')return;document.body.dataset.theme=event.data.theme==='dark'?'dark':'light';});
